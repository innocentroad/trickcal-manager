<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>特殊マス育成コスト試験</title>
  <script>
    (() => {
      const theme = localStorage.getItem('trickcal_theme') || 'dark';
      document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
    })();
  </script>
  <link rel="stylesheet" href="growth-cost-recommendation.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">LOCAL EXPERIMENT</p>
      <h1>特殊マス育成コスト試験</h1>
      <p class="subtitle">対象ステータスを伸ばす候補を、経路・ゲート・スターアップ込みで比較</p>
    </div>
    <div class="top-actions">
      <a href="../stat-dashboard.html">ステータス管理へ</a>
      <button id="theme-toggle" type="button" aria-label="テーマ切替">☼ / ☾</button>
    </div>
  </header>

  <main>
    <section class="panel controls-panel">
      <div class="control-grid">
        <label>対象ステータス<select id="stat-filter">
          <option value="HP">HP</option>
          <option value="攻撃力">攻撃力</option>
          <option value="防御力">防御力</option>
          <option value="会心系">会心系</option>
          <option value="会心抵抗系">会心抵抗系</option>
        </select></label>
        <label>基準<select id="board-mode">
          <option value="current">現在ボード</option>
          <option value="planned">予定込み</option>
        </select></label>
        <label>ボード<select id="layer-filter">
          <option value="all">B1～B3</option>
          <option value="1">B1</option>
          <option value="2">B2</option>
          <option value="3">B3</option>
        </select></label>
        <label>使徒レア度<select id="rarity-filter">
          <option value="all">すべて</option>
          <option value="1">★</option>
          <option value="2">★★</option>
          <option value="3">★★★</option>
          <option value="eldain">エルダイン</option>
        </select></label>
        <label>並び順<select id="sort-filter">
          <option value="special">特級くれよんが少ない順</option>
          <option value="gold">ゴールドが少ない順</option>
          <option value="certificate">証が少ない順</option>
          <option value="efficiency">効果1%あたり</option>
        </select></label>
      </div>
      <div class="control-row">
        <label class="check"><input id="include-star" type="checkbox" checked>スターアップ費用を含める</label>
        <label class="check"><input id="show-unreachable" type="checkbox">未解放条件を含めて表示</label>
        <button id="reload-state" type="button" class="secondary">保存状態を再読込</button>
      </div>
      <p id="state-note" class="muted"></p>
    </section>

    <section class="summary-grid" id="summary"></section>
    <section class="panel">
      <div class="section-heading">
        <div><p class="eyebrow">CANDIDATES</p><h2>次に塗る候補</h2></div>
        <span id="result-count" class="count-badge"></span>
      </div>
      <div id="results" class="results"></div>
    </section>
  </main>
  <script src="../statData.js"></script>
  <script src="growth-cost-recommendation.js"></script>
</body>
</html>
