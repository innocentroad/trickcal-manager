<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ボードプレビュー</title>
  <script>
    try {
      const savedTheme = localStorage.getItem('trickcal_theme')
        || localStorage.getItem('trickcal-board-preview-theme');
      document.documentElement.dataset.theme = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (error) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <link rel="stylesheet" href="board-layout-preview.css?v=20260727a">
</head>
<body>
  <main class="tool-shell">
    <header class="tool-head">
      <div>
        <p class="eyebrow">LOCAL TOOL</p>
        <h1>ボードプレビュー</h1>
        <p>種族・特殊マスタイプ・ボードTierから、3階層の配置をまとめて確認します。</p>
      </div>
      <button type="button" id="board-preview-theme-toggle" class="tool-theme-toggle" aria-label="テーマ切替">
        <svg class="tool-ui-icon tool-theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path></svg>
        <svg class="tool-ui-icon tool-theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.5 14.1A8.5 8.5 0 0 1 9.9 3.5 8.5 8.5 0 1 0 20.5 14.1Z"></path></svg>
      </button>
    </header>

    <section class="panel controls-panel">
      <div class="section-head">
        <h2>テンプレート設定</h2>
        <span id="board-preview-status" class="status" aria-live="polite"></span>
      </div>
      <div class="control-grid">
        <label class="field"><span>使徒から表示</span><select id="board-preview-apostle"></select></label>
        <label class="field"><span>種族</span><select id="board-preview-species"></select></label>
        <label class="field"><span>特殊マスタイプ</span><select id="board-preview-special-type"></select></label>
        <label class="field"><span>攻撃タイプ</span><select id="board-preview-attack-type"><option value="物理">物理</option><option value="魔法">魔法</option></select></label>
      </div>
      <div class="reference-row">
        <span>使用データ</span>
        <strong id="board-preview-reference">-</strong>
      </div>
      <details class="tier-details">
        <summary>ステータス別Tierを調整</summary>
        <div class="tier-grid">
          <label class="field"><span>HP</span><select data-board-preview-tier="hp"></select></label>
          <label class="field"><span>攻撃力</span><select data-board-preview-tier="attack"></select></label>
          <label class="field"><span>物理防御力</span><select data-board-preview-tier="physicalDefense"></select></label>
          <label class="field"><span>魔法防御力</span><select data-board-preview-tier="magicDefense"></select></label>
          <label class="field"><span>会心</span><select data-board-preview-tier="crit"></select></label>
          <label class="field"><span>会心DMG</span><select data-board-preview-tier="critDmg"></select></label>
          <label class="field"><span>会心抵抗</span><select data-board-preview-tier="critRes"></select></label>
          <label class="field"><span>会心DMG抵抗</span><select data-board-preview-tier="critDmgRes"></select></label>
        </div>
      </details>
    </section>

    <section class="panel preview-panel">
      <div class="preview-head">
        <div>
          <h2>連結プレビュー</h2>
          <p>各ゲートを基準にボード1～3を一体化して表示します。</p>
        </div>
        <div class="preview-tools">
          <div class="orientation-switch" role="group" aria-label="ボードの表示方向">
            <button type="button" class="is-active" data-board-orientation="horizontal">横</button>
            <button type="button" data-board-orientation="vertical">縦</button>
          </div>
          <div class="legend" aria-label="マス種別">
            <span><i class="legend-start"></i>開始</span>
            <span><i class="legend-normal"></i>通常</span>
            <span><i class="legend-advanced"></i>上級</span>
            <span><i class="legend-special"></i>特殊</span>
            <span><i class="legend-gate"></i>ゲート</span>
          </div>
        </div>
      </div>
      <div class="board-viewport">
        <div id="board-preview-canvas" class="board-canvas"></div>
      </div>
      <div id="board-preview-popover" class="tile-popover" role="dialog" aria-label="マス詳細" hidden>
        <button type="button" id="board-preview-popover-close" class="tile-popover-close" aria-label="閉じる"><svg class="tool-ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        <div id="board-preview-detail" class="tile-popover-content"></div>
      </div>
    </section>
  </main>

  <script src="../statData.js"></script>
  <script src="board-layout-preview.js?v=20260730a"></script>
</body>
</html>
