<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>編成共有 試作 | Trickcal Manager</title>
  <meta name="description" content="Trickcal Manager 編成共有画面の表示試作">
  <link rel="icon" href="ico.webp?v=20260625" type="image/webp">
  <script src="storage-registry.js?v=20260913a"></script>
  <script src="storage-runtime.js?v=20260913a"></script>
  <script src="storage-bootstrap.js?v=20260913a"></script>
  <script>document.documentElement.dataset.theme = 'dark';</script>
    <link rel="stylesheet" href="formation-share-prototype.css?v=20260910q">
</head>
<body class="formation-share-prototype-page">
  <header class="share-topbar">
    <div class="share-topbar-brand">
      <span class="share-kicker">TRICKCAL MANAGER</span>
      <h1>編成共有 <span>試作</span></h1>
    </div>
    <div class="share-topbar-actions">
      <span class="prototype-badge">表示検証用</span>
      <div class="share-output-options" aria-label="出力表示設定">
        <span>出力表示</span>
        <label><input id="share-show-member-info" type="checkbox" checked> Lv〜ALv</label>
        <label><input id="share-show-skill-levels" type="checkbox" checked> SLv</label>
      </div>
      <button type="button" class="theme-button" id="theme-toggle" aria-label="テーマ切替" aria-pressed="true">
        <span aria-hidden="true">☼</span><span class="theme-button-label">ライト</span>
      </button>
      <a href="stat-dashboard.html" class="back-link">ステータス管理へ</a>
    </div>
  </header>

  <main class="share-shell">
    <section class="share-hero" aria-labelledby="share-title">
      <div>
        <h2 id="share-title">この編成、どうかな？</h2>
      </div>
      <div class="share-source-card">
        <span class="source-label">表示元</span>
        <strong id="snapshot-source">代表サンプル</strong>
        <small id="snapshot-date">読み取り専用</small>
      </div>
    </section>

    <section class="share-panel formation-preview-panel" aria-labelledby="formation-preview-title">
      <div class="panel-heading">
        <div class="formation-heading-title">
          <h2 id="formation-preview-title">編成配置</h2>
          <div id="formation-context" class="formation-context" aria-label="編成タイトル" hidden></div>
        </div>
        <div class="formation-heading-tools">
          <span id="formation-total-cost" class="formation-total-cost" aria-label="総合コスト"></span>
        </div>
      </div>
      <div id="formation-grid" class="formation-grid" aria-live="polite"></div>
    </section>

    <section class="share-support-grid">
      <div class="share-support-top">
        <article class="share-panel support-panel spell-panel" aria-labelledby="spell-title">
          <div class="panel-heading compact-heading">
            <div>
              <h2 id="spell-title">スペル</h2>
            </div>
            <span id="spell-count" class="support-count"></span>
          </div>
          <div id="spell-list" class="support-card-list"></div>
        </article>

        <article class="share-panel support-panel master-power-panel" aria-labelledby="power-title">
          <div class="panel-heading compact-heading">
            <div>
              <h2 id="power-title">教主の権能</h2>
            </div>
            <span class="support-count">1枠</span>
          </div>
          <div id="master-power" class="master-power-preview"></div>
        </article>
      </div>

      <article class="share-panel support-panel global-enhancement-panel" aria-labelledby="global-enhancement-title">
        <div class="panel-heading compact-heading global-enhancement-heading">
          <div>
            <h2 id="global-enhancement-title">全体強化数値</h2>
          </div>
          <details id="global-enhancement-settings" class="global-enhancement-settings">
            <summary>表示設定</summary>
            <div id="global-enhancement-source-options" class="global-enhancement-source-options" aria-label="全体強化数値の表示設定"></div>
          </details>
        </div>
        <div id="global-enhancement-list" class="global-enhancement-list" aria-live="polite"></div>
      </article>

    </section>
  </main>

  <script src="statData.js?v=20260907c"></script>
  <script src="public-release-config.js?v=20260903a"></script>
  <script src="cards.js?v=20260813a"></script>
  <script src="stat-engine.js?v=20260828a"></script>
  <script src="formation-share-prototype.js?v=20260910c"></script>
</body>
</html>
