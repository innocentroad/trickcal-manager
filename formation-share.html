<!doctype html>
<html lang="ja" data-storage-boot-mode="optional">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>編成共有 | Trickcal Manager</title>
  <meta name="description" content="Trickcal Managerの編成共有">
  <link rel="icon" href="ico.webp?v=20260625" type="image/webp">
  <script>
    (() => {
      let savedTheme = '';
      try { savedTheme = window.localStorage?.getItem('trickcal_theme') || ''; } catch (_) { /* no-op */ }
      const prefersLight = window.matchMedia?.('(prefers-color-scheme: light)').matches;
      document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark'
        ? savedTheme
        : (prefersLight ? 'light' : 'dark');
    })();
  </script>
  <link rel="stylesheet" href="shared-topbar.css?v=20260918h">
  <link rel="stylesheet" href="announcements.css?v=20260919history">
  <link rel="stylesheet" href="formation-share-prototype.css?v=2a59d4d656c33b66">
</head>
<body class="formation-share-page">
  <div
    class="dashboard-top-control-bar"
    data-shared-topbar-page="share"
    data-shared-topbar-manager-href="stat-dashboard.html?view=settings"
    data-shared-topbar-calc-href="formation-damage-calc.html"
  >
    <div data-shared-topbar-common></div>
  </div>

  <main class="share-shell">
    <header class="share-page-heading">
      <h1>編成共有</h1>
    </header>
    <section id="share-error" class="share-panel share-error" hidden role="alert" aria-live="assertive">
      <h2>共有編成を表示できません</h2>
      <p id="share-error-message">URLの内容を確認してください。</p>
      <a href="stat-dashboard.html" class="back-link">ステータス管理へ戻る</a>
    </section>

    <div id="share-content">
      <section class="share-panel formation-preview-panel" aria-labelledby="formation-preview-title">
        <div class="panel-heading">
          <div class="formation-heading-title">
            <h2 id="formation-preview-title">編成配置</h2>
          </div>
          <div class="formation-heading-tools">
            <span id="formation-total-cost" class="formation-total-cost" aria-label="総合コスト"></span>
          </div>
        </div>
        <div id="formation-grid" class="formation-grid" aria-live="polite"></div>
      </section>

      <section class="share-support-grid">
        <div class="share-support-top">
          <article class="share-panel support-panel spell-panel" aria-labelledby="spell-title">
            <div class="panel-heading compact-heading">
              <h2 id="spell-title">スペル</h2>
              <span id="spell-count" class="support-count"></span>
            </div>
            <div id="spell-list" class="support-card-list"></div>
          </article>

          <article class="share-panel support-panel master-power-panel" aria-labelledby="power-title">
            <div class="panel-heading compact-heading">
              <h2 id="power-title">教主の権能</h2>
              <span id="power-count" class="support-count"></span>
            </div>
            <div id="master-power" class="master-power-list"></div>
          </article>
        </div>

        <article id="global-enhancement-panel" class="share-panel support-panel global-enhancement-panel" aria-labelledby="global-enhancement-title">
          <div class="panel-heading compact-heading">
            <h2 id="global-enhancement-title">全体強化数値</h2>
          </div>
          <div id="global-enhancement-list" class="global-enhancement-list" aria-live="polite"></div>
        </article>
      </section>
    </div>
  </main>

  <aside id="share-action-bar" class="share-action-bar" aria-label="共有操作">
    <span id="share-image-state" class="share-image-state" aria-live="polite">画像は未生成です。</span>
    <div class="share-action-buttons">
      <button type="button" id="share-image-generate" class="share-action-button share-action-generate">画像を生成</button>
      <button type="button" id="share-image-copy" class="share-action-button share-action-copy" disabled>画像をコピー</button>
      <button type="button" id="share-image-save" class="share-action-button share-action-save" disabled>画像を保存</button>
      <button type="button" id="share-url-copy" class="share-action-button share-action-url">URLをコピー</button>
    </div>
  </aside>

  <script src="storage-registry.js?v=20260913a"></script>
  <script src="storage-runtime.js?v=20260913a"></script>
  <script src="storage-bootstrap.js?v=20260913a"></script>
  <script src="shared-topbar.js?v=20260918i"></script>
  <script src="announcements-release-config.js?v=20260915a"></script>
  <script src="announcements-data.js?v=20260915b"></script>
  <script src="announcement-history-data.js?v=20260919history"></script>
  <script src="announcements.js?v=20260919history"></script>
  <script src="formation-share-display-data.js?v=b583f54a6d7c8b00"></script>
  <script src="formation-share-catalog.js?v=c795d918708efd9c"></script>
  <script src="formation-personality.js"></script>
  <script src="formation-share-codec.js?v=ff3f685a11f3fc3a"></script>
  <script src="formation-share.js?v=593a192af15b18bc"></script>
  <script src="formation-share-image.js?v=9bac3ba76e150288"></script>
  <script src="formation-share-page-actions.js?v=5c9b6dca93fe7614"></script>
</body>
</html>
